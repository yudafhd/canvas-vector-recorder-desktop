name: Publish desktop update

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      LICENSE_PRODUCT_CODE: CVR
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "$LICENSE_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Validate Guardian public key format
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.LICENSE_PUBLIC_KEY.trim();
          if (!/^[A-Za-z0-9_-]+$/.test(value)) {
            throw new Error('LICENSE_PUBLIC_KEY must be raw base64url without a prefix, PEM header, padding, or whitespace');
          }
          const bytes = Buffer.from(value, 'base64url');
          if (value.length !== 43 || bytes.length !== 32) {
            throw new Error(`LICENSE_PUBLIC_KEY must be 43 base64url characters / 32 bytes; received ${value.length} characters / ${bytes.length} bytes`);
          }
          console.log(`LICENSE_PUBLIC_KEY format OK (${value.length} characters / ${bytes.length} bytes)`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Canvas Vector Recorder v__VERSION__
          releaseBody: Signed desktop update for Canvas Vector Recorder.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Read published release tag
        if: matrix.platform == 'windows-latest'
        id: release_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows portable executable
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          files: src-tauri/target/release/canvas-vector-recorder-desktop.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
