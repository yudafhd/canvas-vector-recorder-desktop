name: Build desktop installers

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Intel
    runs-on: macos-15-intel
    env:
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate license key configuration
        shell: bash
        run: test -n "$LICENSE_PUBLIC_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Build macOS installers
        run: npm run tauri:build -- --no-sign

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvas-vector-recorder-macos-intel
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate license key configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_PUBLIC_KEY)) {
            throw 'Repository secret LICENSE_PUBLIC_KEY belum diatur.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Build Windows installers
        run: npm run tauri:build -- --no-sign

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvas-vector-recorder-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
