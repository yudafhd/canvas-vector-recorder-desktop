<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Audit kurva barong — SVG UI</title>
<style>body{font:16px system-ui;background:#181b20;color:#eee;margin:24px}p{max-width:1000px;color:#bac4d2}a{color:#87caff}nav{display:flex;flex-wrap:wrap;gap:14px;margin:20px 0}button,input{font:inherit}#viewport{height:70vh;overflow:auto;border:1px solid #555;background:#333}#stage{position:relative;width:4096px;height:4096px}img{position:absolute;width:100%;height:100%;inset:0}#right{clip-path:inset(0 0 0 50%)}#divider{position:absolute;top:0;bottom:0;left:50%;background:#37b5ff;width:2px}button{padding:7px}</style>
<h1>Audit seluruh kurva barong</h1><p>Kiri: SVG UI yang diberikan. Kanan: kandidat penyederhanaan pada SVG tersebut, bukan hasil tracing ulang Tauri. Bentuk dijaga; ini bukan perbandingan dengan raster sumber.</p>
<nav><button data-area="eyes">Mata</button><button data-area="tongue">Lidah</button><button data-area="fangs">Taring</button><button data-area="ornaments">Ornamen</button><button data-area="whole">Seluruh gambar</button><label>Batas <input id="split" type="range" min="0" max="100" value="50"></label><label>Zoom <input id="zoom" type="range" min="100" max="800" step="100" value="400"></label></nav>
<div id="viewport"><div id="stage"><img src="ui-before.svg" alt="Baseline UI"><img id="right" src="candidate.svg" alt="Kandidat geometri"><div id="divider"></div></div></div>
<p><a href="REPORT.md">Laporan dan batas pengujian</a> · <a href="validation.json">Validasi geometri</a> · <a href="candidate.svg">Kandidat SVG</a></p>
<script>const $=id=>document.getElementById(id);const regions={eyes:[505,291],tongue:[512,590],fangs:[512,515],ornaments:[510,166],whole:[512,512]};let focus='tongue';
function show(){const scale=Number($('zoom').value)/100;const size=1024*scale;$('stage').style.width=size+'px';$('stage').style.height=size+'px';requestAnimationFrame(()=>{const v=$('viewport');v.scrollLeft=regions[focus][0]*scale-v.clientWidth/2;v.scrollTop=regions[focus][1]*scale-v.clientHeight/2;});}
$('split').oninput=()=>{const value=$('split').value;$('right').style.clipPath=`inset(0 0 0 ${value}%)`;$('divider').style.left=value+'%';};$('zoom').oninput=show;document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{focus=b.dataset.area;if(focus==='whole')$('zoom').value=100;else $('zoom').value=400;show();});show();</script></html>
